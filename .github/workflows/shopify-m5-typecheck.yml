name: Shopify M5 Typecheck

on:
  push:
    branches:
      - workstream/shopify-m5

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Shopify M5 strict typecheck
        run: npm run typecheck:shopify-m5
