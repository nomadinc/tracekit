name: WS-001A isolated native acceptance
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: "WS-022 reviewed exact 40-character acceptance commit SHA"
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: ws001a-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  revision-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Fail before checkout if exact reviewed branch commit mismatches
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/ws001a/native-acceptance-gha-6d56ec1' ]]
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_SHA" == "$EXPECTED_COMMIT" ]]
          echo "PASS: dispatch event commit matches independently reviewed immutable SHA"
  acceptance:
    needs: revision-guard
    if: needs.revision-guard.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: fixture_admin
      PGPASSWORD: synthetic-fixture-only
      PGDATABASE: acceptance
      POSTGRES_IMAGE: 'postgres@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929'
      POSTGREST_IMAGE: 'postgrest/postgrest@sha256:b574528fe109c8343c1247155734d03df8c34b462f342dca0ccc20244fc36ef9'
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
    steps:
      - name: Checkout exact reviewed SHA (no persisted credentials)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Record provenance and fail closed on unpinned source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p acceptance-logs
          git rev-parse HEAD | tee acceptance-logs/commit.txt
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$GITHUB_SHA" = "$EXPECTED_COMMIT"
          cp ui/tests/native/ws001a-supply-chain.manifest acceptance-logs/supply-chain.manifest
          git cat-file -e 6d56ec1bb30b9eb812515cfcb802408b25f521f3^{commit}
          git merge-base --is-ancestor 6d56ec1bb30b9eb812515cfcb802408b25f521f3 HEAD
          printf '%s  %s\n' \
            c5c3910540d02f74a5666bdc9f2d423ccfdb139850d50e101eb20d52a001e9ee ui/lib/commerce/next29-financial-persistence.ts \
            a16759825ff9007bbf84007474531675f1c08b5de4c8df084017d54baf0e7ebb ui/tests/next29-financial-persistence.test.ts \
            | sha256sum --check | tee acceptance-logs/candidate-hashes.txt
      - name: Prepare dependencies and verified immutable images before network lockdown
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client iptables curl
          sudo useradd -u 25003 -M -s /usr/sbin/nologin ws001a-test
          sudo mkdir -p /tmp/ws001a-test
          sudo chown 25003:25003 /tmp/ws001a-test
          sudo chown -R 25003:25003 acceptance-logs
          sudo chmod 1777 acceptance-logs # both runner (logs) and confined test UID (writer evidence)
          docker pull --platform linux/amd64 "$POSTGRES_IMAGE"
          docker pull --platform linux/amd64 "$POSTGREST_IMAGE"
          docker image inspect "$POSTGRES_IMAGE" --format '{{index .RepoDigests 0}}' | tee acceptance-logs/postgresql-image.txt
          docker image inspect "$POSTGREST_IMAGE" --format '{{index .RepoDigests 0}}' | tee acceptance-logs/postgrest-image.txt
          test "$(docker image inspect "$POSTGRES_IMAGE" --format '{{.Os}}/{{.Architecture}}')" = "linux/amd64"
          test "$(docker image inspect "$POSTGREST_IMAGE" --format '{{.Os}}/{{.Architecture}}')" = "linux/amd64"
          docker run --rm --network none --platform linux/amd64 "$POSTGRES_IMAGE" id -u postgres |
            tee acceptance-logs/postgresql-image-uid.txt
          id -u ws001a-test | tee acceptance-logs/contained-test-uid.txt
          test "$(cat acceptance-logs/contained-test-uid.txt)" = 25003
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install locked application dependencies and verify tsx
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix ui --ignore-scripts
          test -x ui/node_modules/.bin/tsx
          ui/node_modules/.bin/tsx --version | tee acceptance-logs/tsx-version.txt
          node --version | tee acceptance-logs/node-version.txt
          npm --version | tee acceptance-logs/npm-version.txt
      - name: Enforce loopback-only IPv4 and IPv6 before starting native services
        shell: bash
        run: |
          set -euo pipefail
          bash ui/tests/native/ws001a-lockdown.sh
          docker run -d --name ws001a-postgres --network host --platform linux/amd64 \
            --security-opt no-new-privileges \
            -e POSTGRES_DB=acceptance -e POSTGRES_USER=fixture_admin \
            -e POSTGRES_PASSWORD=synthetic-fixture-only \
            "$POSTGRES_IMAGE" -c listen_addresses=127.0.0.1
          for i in $(seq 1 40); do
            if pg_isready -h 127.0.0.1 -p 5432 -U fixture_admin -d acceptance >/dev/null 2>&1; then break; fi
            sleep 1
          done
          pg_isready -h 127.0.0.1 -p 5432 -U fixture_admin -d acceptance
          test "$(docker exec ws001a-postgres id -u postgres)" = "$(cat acceptance-logs/postgresql-image-uid.txt)"
          ss -ltn '( sport = :5432 )' | tee acceptance-logs/postgresql-listener.txt
          grep -F '127.0.0.1:5432' acceptance-logs/postgresql-listener.txt
      - name: PostgreSQL 17.6 and synthetic NUMERIC fixture
        shell: bash
        run: |
          set -euo pipefail
          bash ui/tests/native/ws001a-contained-exec.sh psql -X -v ON_ERROR_STOP=1 -Atqc 'show server_version;' | tee acceptance-logs/postgresql-version.txt
          grep -E '^17\.6([ .]|$)' acceptance-logs/postgresql-version.txt
          bash ui/tests/native/ws001a-contained-exec.sh psql -X -v ON_ERROR_STOP=1 -f ui/tests/native/ws001a-synthetic-schema.sql 2>&1 | tee acceptance-logs/schema.log
          bash ui/tests/native/ws001a-contained-exec.sh psql -X -Atqc "select amount::text from platform_orders where provider_order_id='102872'" | tee acceptance-logs/numeric-order.txt
          grep -Fx '123.450000' acceptance-logs/numeric-order.txt
          bash ui/tests/native/ws001a-contained-exec.sh psql -X -Atqc "select amount::text,fee_amount is null,net_amount is null from payment_transactions where transaction_id='2446'" | tee acceptance-logs/numeric-payment.txt
          grep -Fx '19.990000|t|t' acceptance-logs/numeric-payment.txt
          bash ui/tests/native/ws001a-contained-exec.sh psql -X -Atqc "select indexname,indexdef from pg_indexes where tablename in ('platform_orders','payment_transactions') order by indexname" > acceptance-logs/indexes.txt
          bash ui/tests/native/ws001a-contained-exec.sh psql -X -v ON_ERROR_STOP=1 -f ui/tests/native/ws001a-negative.sql 2>&1 | tee acceptance-logs/native-negative.log
          bash ui/tests/native/ws001a-contained-exec.sh bash ui/tests/native/ws001a-concurrency.sh 2>&1 | tee acceptance-logs/native-concurrency.log
      - name: PostgREST 14.5 real HTTP GET and guarded PATCH
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name ws001a-postgrest --network host --platform linux/amd64 \
            --user 25002:25002 --security-opt no-new-privileges \
            -e PGRST_DB_URI='postgres://postgrest_login:synthetic-api-only@127.0.0.1:5432/acceptance' \
            -e PGRST_DB_SCHEMAS=public -e PGRST_DB_ANON_ROLE=web_anon \
            -e PGRST_SERVER_HOST=127.0.0.1 -e PGRST_SERVER_PORT=3000 \
            "$POSTGREST_IMAGE"
          for i in $(seq 1 40); do
            if curl --fail --silent 'http://127.0.0.1:3000/platform_orders?select=id&limit=1' >/dev/null; then break; fi
            sleep 1
          done
          docker logs ws001a-postgrest > acceptance-logs/postgrest-startup.log 2>&1
          test "$(docker exec ws001a-postgrest id -u)" = 25002
          ss -ltn '( sport = :3000 )' | tee acceptance-logs/postgrest-listener.txt
          grep -F '127.0.0.1:3000' acceptance-logs/postgrest-listener.txt
          bash ui/tests/native/ws001a-contained-exec.sh psql -X -Atqc "SELECT rolname,rolsuper,rolcanlogin,rolinherit FROM pg_roles WHERE rolname IN ('fixture_admin','postgrest_login','web_anon') ORDER BY rolname" | tee acceptance-logs/role-authority.txt
          grep -F 'postgrest_login|f|t|f' acceptance-logs/role-authority.txt
          docker exec ws001a-postgrest postgrest --version 2>&1 | tee acceptance-logs/postgrest-version.txt
          grep -E '(^|[^[:digit:].])14[.]5([.]0)?([^[:digit:].]|$)' acceptance-logs/postgrest-version.txt
          bash ui/tests/native/ws001a-contained-exec.sh curl --fail-with-body -sS -i 'http://127.0.0.1:3000/platform_orders?provider_order_id=eq.102872&account_id=eq.11111111-1111-4111-8111-111111111111&organization_id=eq.aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa&connection_id=eq.aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaab&provider_account_id=eq.aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaac&select=id,platform_order_id,amount,version' | tee acceptance-logs/http-get.txt
          bash ui/tests/native/ws001a-contained-exec.sh curl --fail-with-body -sS -i -X PATCH \
            -H 'Content-Type: application/json' -H 'Prefer: return=representation,count=exact' \
            --data '{"version":2}' \
            'http://127.0.0.1:3000/platform_orders?provider_order_id=eq.102872&account_id=eq.11111111-1111-4111-8111-111111111111&organization_id=eq.aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa&connection_id=eq.aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaab&provider_account_id=eq.aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaac&version=eq.1&select=id,version' | tee acceptance-logs/http-cas-success.txt
          bash ui/tests/native/ws001a-contained-exec.sh curl --fail-with-body -sS -i -X PATCH \
            -H 'Content-Type: application/json' -H 'Prefer: return=representation,count=exact' \
            --data '{"version":3}' \
            'http://127.0.0.1:3000/platform_orders?provider_order_id=eq.102872&account_id=eq.11111111-1111-4111-8111-111111111111&organization_id=eq.aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa&connection_id=eq.aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaab&provider_account_id=eq.aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaac&version=eq.1&select=id,version' | tee acceptance-logs/http-cas-stale.txt
          # Validate the raw HTTP status, JSON representation and optional Content-Range
          # together; a missing header alone must not invalidate a zero-row result.
          bash ui/tests/native/ws001a-contained-exec.sh python3 ui/tests/native/ws001a-http-cas-assert.py --self-test \
            2>&1 | tee acceptance-logs/http-validator-selftest.log
          bash ui/tests/native/ws001a-contained-exec.sh python3 ui/tests/native/ws001a-http-cas-assert.py \
            --get acceptance-logs/http-get.txt \
            --success acceptance-logs/http-cas-success.txt \
            --stale acceptance-logs/http-cas-stale.txt \
            --out acceptance-logs/http-cas-validated.json \
            2>&1 | tee acceptance-logs/http-cas-validation.log
          # Independent durable state check: HTTP 200 by itself does not prove a write.
          bash ui/tests/native/ws001a-contained-exec.sh psql -X -v ON_ERROR_STOP=1 -Atqc \
            "SELECT id, version, amount::text FROM platform_orders WHERE platform='next29' AND platform_order_id='102872' AND provider_order_id='102872' AND account_id='11111111-1111-4111-8111-111111111111' AND organization_id='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa' AND connection_id='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaab' AND provider_account_id='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaac'" \
            | tee acceptance-logs/http-cas-db-final.txt
          python3 - <<'PY'
          import json
          evidence=json.load(open('acceptance-logs/http-cas-validated.json',encoding='utf-8'))
          rows=open('acceptance-logs/http-cas-db-final.txt',encoding='utf-8').read().splitlines()
          expected=f"{evidence['original_order_id']}|2|123.450000"
          assert rows==[expected], f"CAS persisted identity/version/amount mismatch: {rows!r}, expected {expected!r}"
          print("PASS: exactly one scoped database row, original id, version 2, unchanged exact amount")
          PY
      - name: Execute unchanged persistence writer against real PostgREST
        shell: bash
        run: |
          set -euo pipefail
          bash ui/tests/native/ws001a-contained-exec.sh ui/node_modules/.bin/tsx ui/tests/native/ws001a-actual-writer.ts 2>&1 | tee acceptance-logs/actual-writer-test.log
      - name: Focused accepted test suite
        shell: bash
        run: |
          set -o pipefail
          bash ui/tests/native/ws001a-contained-exec.sh bash -c 'cd ui && node --experimental-transform-types --test tests/next29-financial-persistence.test.ts' 2>&1 | tee acceptance-logs/focused-tests.log
      - name: Collect failure diagnostics and immutable evidence manifest
        if: always()
        shell: bash
        run: |
          bash ui/tests/native/ws001a-collect-evidence.sh || true
      - name: Fail closed on missing mandatory acceptance evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          bash ui/tests/native/ws001a-evidence-completeness.sh
      - name: Preserve raw logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ws001a-native-logs
          path: acceptance-logs/
          if-no-files-found: warn
          retention-days: 30
