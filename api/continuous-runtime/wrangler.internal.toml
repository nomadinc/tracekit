name = "tracekit-continuous-runtime"
main = "src/index.ts"
compatibility_date = "2024-06-20"
workers_dev = false
preview_urls = false
compatibility_flags = ["nodejs_compat"]

[vars]
SUPABASE_URL = "https://uoeosoiegatlqtzemsfv.supabase.co"
COMMERCE_CREDENTIALS_ENCRYPTION_VERSION = "1"
TRACEKIT_COMMERCE_SCHEDULER_ENABLED = "true"
TRACEKIT_COMMERCE_KILL_SWITCH = "enabled"

# This Worker intentionally has no cron, queue, producer, or consumer bindings.
# Required server-only secrets (set with `wrangler secret put`):
# SUPABASE_SERVICE_ROLE_KEY, COMMERCE_CREDENTIALS_ENC_KEY, COMMERCE_CREDENTIALS_KEY_ID, TK_SECRET_KEY
