max_retries = 10

# Phase 2.8 Continuous Commerce orchestration. The binding may be deployed,
# but the database control and environment switch both default disabled.
[[queues.producers]]
queue = "continuous-commerce"
binding = "continuous_commerce"

[[queues.consumers]]
queue = "continuous-commerce"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 5
  

[triggers]
crons = ["0 * * * *"] # every hour

# Phase 2.8 note: this existing trigger is not authorization to run Continuous
# Commas or TKID. Production-intelligence jobs must pass the database capability
# controls and server-only configuration validator; their controls deploy disabled.

# Required Cloudflare Worker secrets:
# - SUPABASE_SERVICE_ROLE_KEY
# - KONNEKTIVE_INGEST_TOKEN
# - EVERFLOW_INGEST_TOKEN
# - INTEGRATIONS_ENC_KEY
# - TK_SECRET_KEY
# - TKID_HANDOFF_SIGNING_KEY_CURRENT (separate key; referenced by TKID handoff key metadata)
# - TKID_HANDOFF_SIGNING_KEY_PREVIOUS (rotation window only)
# - TRACEKIT_TKID_HANDOFF_SECRET (current v1 runtime binding; server-only, never a plain var)
# - OPERATIONAL_ALERT_DESTINATION (when an approved existing destination is selected)
#
# Set each with:
# npx wrangler secret put SECRET_NAME
