name = "tracekit-api"
main = "src/index.ts"
compatibility_date = "2024-06-20"
routes = [
  { pattern = "journey.trace-kit.io", custom_domain = true },
  { pattern = "api.trace-kit.io", custom_domain = true },
  { pattern = "webhooks.trace-kit.io", custom_domain = true },
]


[vars]
  SUPABASE_URL = "https://uoeosoiegatlqtzemsfv.supabase.co"
  TRACEKIT_ROOT_DOMAIN = "buyecowatt.com"
  TRACEKIT_AUTO_LINK_OUTBOUND = "true"
  TRACEKIT_COMMERCE_SCHEDULER_ENABLED = "true"
  TRACEKIT_MAINTENANCE_WRITE_GATE_ENABLED = "false"
  TRACEKIT_COMMERCE_KILL_SWITCH = "enabled"
  TRACEKIT_TKID_ERASURE_EXECUTOR_ENABLED = "false"
  TRACEKIT_TKID_RELAY_ENABLED = "false"
  TRACEKIT_TKID_RELAY_ORIGIN = "https://journey.trace-kit.io"
  
[[queues.producers]]
queue = "wowboost-imports"
binding = "wowboost_imports"

# Commas continuous sync is gated by its connected scope, enabled schedule,
# production control, pause state, active-run and provider-quota checks.
[[queues.producers]]
queue = "continuous-commerce"
binding = "continuous_commerce"

[[queues.producers]]
queue = "tracekit-everflow-firehose"
binding = "everflow_firehose"

[[queues.consumers]]
queue = "wowboost-imports"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 10

[[queues.consumers]]
queue = "continuous-commerce"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 10

[[queues.consumers]]
queue = "tracekit-everflow-firehose"
max_batch_size = 10
max_batch_timeout = 2
max_retries = 10
dead_letter_queue = "tracekit-everflow-firehose-dlq"

# This service must be provisioned separately; the binding does not authorize work.
[[services]]
binding = "CONTINUOUS_COMMERCE_RUNTIME"
service = "tracekit-continuous-runtime"

# Queue dispatch remains guarded by the Commas continuous-sync control plane.

[triggers]
crons = ["*/5 * * * *"] # cadence selection runs every five minutes; schedules decide eligibility

# The Commas scheduler still requires the database capability, connection,
# schedule, lease and quota gates. TKID has separate controls.

# Required Cloudflare Worker secrets:
# - SUPABASE_SERVICE_ROLE_KEY
# - KONNEKTIVE_INGEST_TOKEN
# - EVERFLOW_INGEST_TOKEN
# - INTEGRATIONS_ENC_KEY_V2 (current version-2 write and decrypt key)
# Temporary retirement-pending secrets; current rows do not depend on them:
# - INTEGRATIONS_ENC_KEY
# - INTEGRATIONS_ENC_KEY_V1
# - INTEGRATIONS_ENC_KEY_LEGACY_B
# - INTEGRATIONS_ENC_KEY_LEGACY_C
# Production must explicitly set INTEGRATIONS_ENC_WRITE_VERSION=2. The source
# default remains 1 only for compatibility and is not a safe production fallback.
# - TK_SECRET_KEY
# - COMMAS_WEBHOOK_SECRET (secret_key returned by the Commas webhook subscription)
# - EVERFLOW_FIREHOSE_SECRET (dedicated 256-bit bearer secret; never a plain var)
# - TKID_HANDOFF_SIGNING_KEY_CURRENT (separate key; referenced by TKID handoff key metadata)
# - TKID_HANDOFF_SIGNING_KEY_PREVIOUS (rotation window only)
# - TRACEKIT_TKID_HANDOFF_SECRET (current v1 runtime binding; server-only, never a plain var)
# - OPERATIONAL_ALERT_DESTINATION (when an approved existing destination is selected)
#
# Set each with:
# npx wrangler secret put SECRET_NAME
