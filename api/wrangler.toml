name = "tracekit-api"
main = "src/index.ts"
compatibility_date = "2024-06-20"
routes = [{ pattern = "journey.trace-kit.io", custom_domain = true }]


[vars]
  SUPABASE_URL = "https://uoeosoiegatlqtzemsfv.supabase.co"
  TRACEKIT_ROOT_DOMAIN = "buyecowatt.com"
  TRACEKIT_AUTO_LINK_OUTBOUND = "true"
  TRACEKIT_COMMERCE_SCHEDULER_ENABLED = "false"
  TRACEKIT_MAINTENANCE_WRITE_GATE_ENABLED = "false"
  TRACEKIT_COMMERCE_KILL_SWITCH = "disabled"
  TRACEKIT_TKID_ERASURE_EXECUTOR_ENABLED = "false"
  TRACEKIT_TKID_RELAY_ENABLED = "false"
  TRACEKIT_TKID_RELAY_ORIGIN = "https://journey.trace-kit.io"
  
  [[queues.producers]]
queue = "wowboost-imports"
binding = "wowboost_imports"

[[queues.consumers]]
queue = "wowboost-imports"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 10

# Phase 2.8 Continuous Commerce implementation remains dormant in source.
# Production Queue attachment requires a separate reviewed configuration change.

[triggers]
crons = ["0 * * * *"] # every hour

# Phase 2.8 note: this existing trigger is not authorization to run Continuous
# Commas or TKID. Production-intelligence jobs must pass the database capability
# controls and server-only configuration validator; their controls deploy disabled.

# Required Cloudflare Worker secrets:
# - SUPABASE_SERVICE_ROLE_KEY
# - KONNEKTIVE_INGEST_TOKEN
# - EVERFLOW_INGEST_TOKEN
# - INTEGRATIONS_ENC_KEY
# - INTEGRATIONS_ENC_KEY_V1 (temporary version-1 compatibility binding)
# - INTEGRATIONS_ENC_KEY_LEGACY_B (deterministic version-1 legacy lineage)
# - INTEGRATIONS_ENC_KEY_LEGACY_C (decrypt-only version-3 legacy lineage)
# - INTEGRATIONS_ENC_KEY_V2 (future replacement; not required while writes remain v1)
# INTEGRATIONS_ENC_WRITE_VERSION is a non-secret var and defaults to 1 when absent.
# - TK_SECRET_KEY
# - TKID_HANDOFF_SIGNING_KEY_CURRENT (separate key; referenced by TKID handoff key metadata)
# - TKID_HANDOFF_SIGNING_KEY_PREVIOUS (rotation window only)
# - TRACEKIT_TKID_HANDOFF_SECRET (current v1 runtime binding; server-only, never a plain var)
# - OPERATIONAL_ALERT_DESTINATION (when an approved existing destination is selected)
#
# Set each with:
# npx wrangler secret put SECRET_NAME
